[project]
name = "genai-with-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "bentoml>=1.4.39",
    "diffusers>=0.39.0",
    "fastapi[standard]>=0.141.1",
    "open3d>=0.19.0",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "soundfile>=0.14.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.1",
]

# --------------------------------------------------------------------------
# Dev tooling (PEP 735 group — installed by `uv sync`, excluded from builds)
# --------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

# --------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8, isort, black, pyupgrade, bandit)
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "src", "tests"]
extend-exclude = [".venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async — catches blocking calls in async defs
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print — no stray print()
    "TID",   # flake8-tidy-imports
    "PTH",   # prefer pathlib over os.path
    "ANN",   # flake8-annotations
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length is the formatter's job
    "ANN401", # allow `Any` for *args / **kwargs
    "S104",   # binding 0.0.0.0 is normal for containerised uvicorn
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"] # asserts and untyped test fns are fine
"__init__.py" = ["F401"]          # re-exports

# FastAPI puts callables in argument defaults on purpose — without this,
# every `= Depends(...)` trips B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy — static type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
